# stand_up_bottle: "Stand the bottle upright." 55 YAM episodes (0-54) at 30 fps;
# as in place_cube_right only the right arm moves.
#
# Episodes 0-49 train the model and fit the normalization stats (auto-built as
# meta/yam_normalization_stats_train_0-50[_delta32].npy); episodes 50-54 are
# held out for open-loop evaluation. Everything else is yam.yaml's. Delta arm
# actions are opted into at launch (dataloader.delta_action_dims=["0-5","7-12"]),
# as in the place_cube_right *_delta runs.
defaults:
  - yam
  - _self_

dataset_dir: /data/takuya/OpenWAM/assets/datasets/stand_up_bottle

splits:
  train: "0:50"
  val: "50:55"
