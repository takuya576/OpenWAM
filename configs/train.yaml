defaults:
  - model: dual_system            # [Optional]: dual_system(default), single_system, tri_system
  - dataloader: robotwin          # [Optional]: robotwin(default), mixture (four-source pretraining), ebench, robocasa365, robocasa_gr1, robodojo, vlabench, libero, yam
  - _self_

training:
  # Preset files contain literal KEY=VALUE settings and override matching env vars.
  # CLI/YAML selection overrides OPENWAM_PRESET; null skips loading (keeps manual env vars).
  speed_preset: ${oc.env:OPENWAM_PRESET,presets/fast.env}

  # --- Debug ---
  debug: false                    # Debug mode: max_steps=20, save@10, constant LR

  # --- Optimizer ---
  learning_rate: 1e-4             # Base learning rate for AdamW
  adam_betas: [0.9, 0.95]         # AdamW (beta1, beta2)
  weight_decay: 0.01              # AdamW weight decay
  max_grad_norm: 1.0              # Gradient clipping max norm

  # --- Schedule ---
  num_epochs: 5                   # Total training epochs (null = step-only, driven solely by max_steps)
  max_steps: null                 # Early stop after N steps (null = no limit; required when num_epochs is null)
  batch_size: 16                   # Per-GPU batch size
  gradient_accumulation_steps: 1  # Accumulate N micro-batches before optimizer step

  # --- LR scheduler ---
  lr_scheduler: cosine            # cosine with linear warmup; constant = linear warmup, then flat
                                  # (every checkpoint = a run stopped there); null = constant LR, no warmup
  warmup_ratio: 0.05              # Fraction of total steps for linear warmup
  lr_min_ratio: 0.01              # Minimum LR as fraction of learning_rate

  # --- Per-module LR (null = use base learning_rate) ---
  action_lr: null                 # Override LR for action model parameters
  video_lr: null                  # Override LR for video backbone parameters

  # --- DeepSpeed / precision ---
  mixed_precision: bf16           # bf16 / fp16 / no — training + deploy compute dtype
  zero_stage: 2                   # DeepSpeed ZeRO stage: 1 or 2 (CLI override: training.zero_stage=1)

  # --- Memory optimization ---
  use_gradient_checkpointing: true       # Recompute activations in backward instead of storing them: saves memory
                                         # costs ~1 extra forward (standard term; cf. PyTorch/HF)
  gradient_checkpointing_layers: null    # null: all layers; non-negative integer: first N (0: none), capped at total
                                         # Only when use_gradient_checkpointing=true; dual joint_self_attn and IDM's
                                         # standard joint-loop fallback only (not IDM teacher-forcing, single or tri).
  use_gradient_checkpointing_offload: false  # Offload checkpointed activations to CPU
  text_encoder_offload: false            # Offload frozen/eval Wan text-encoder weights to CPU between cache misses
                                         # Requires OPENWAM_TEXT_CACHE=1 (enabled by presets/fast.env), independent of GC
  initialize_model_on_cpu: false         # Load model on CPU, let DeepSpeed move to GPU
  offload_optimizer_device: none         # DeepSpeed ZeRO optimizer-state offload: none / cpu

  # --- LoRA (parameter-efficient fine-tuning; see openwam/model/lora.py) ---
  # Adapters W + (alpha/rank)·B·A on every nn.Linear under `targets` (pretrained W frozen), the `full_train`
  # modules trained in full, everything else frozen. Checkpoints are saved MERGED (adapters folded into W,
  # adapter keys dropped), so they deploy / warm-start exactly like a full fine-tune's.
  lora:
    enabled: false
    rank: 128
    alpha: 128                    # scaling = alpha / rank
    dropout: 0.0
    lr: null                      # LR of the adapter params (null = learning_rate); full_train params keep learning_rate
    targets: [video_backbone.dit]  # module prefixes whose nn.Linear layers get adapters
    exclude: []                   # globs on dotted layer names that never get an adapter
    full_train: [action_backbone, proprio_encoder, video_backbone.dit.head, video_backbone.dit.patch_embedding]
    train_bias_and_norm: true     # also train biases, norm weights and AdaLN modulation inside `targets` (~3M params)

  # --- Loss weights ---
  lambda_video: 1.0               # Video flow-matching loss weight
  lambda_action: 1.0              # Action flow-matching loss weight

  # --- GAE alignment loss (training-only; docs/gae_alignment.md, openwam/model/gae_align.py) ---
  # Aligns the future-frame video tokens after DiT block `layer` to cached GAE geometry latents of the
  # ground-truth future frames through a projector that is dropped at deployment. Needs
  # dataloader.gae_cache_dir (written by scripts/geometry/gae_cache.py) and the joint self-attention architecture.
  gae_align:
    enabled: false
    layer: 15                     # hidden states after this many of the 30 DiT blocks
    weight: 0.5                   # total = lambda_video*video + lambda_action*action + weight*align
    loss: cosine                  # cosine | mse | cosine_mse  (on GAE's standardized latent)
    hidden_dim: 2048              # projector width

  # --- Relational Geometry Forcing baseline (training-only; docs/rgf_baseline.md, openwam/model/rgf_align.py) ---
  # Re-implementation of arXiv 2610.29282: cosine relation matrices of the video tokens (intra-frame per view,
  # cross-view per view pair) and of the action tokens (step-to-step), after `layer` blocks of both experts,
  # matched with a Huber loss to those of a frozen multi-view 3D teacher. Two-layer SiLU heads, dropped at
  # deployment. Needs dataloader.rgf_cache_dir (scripts/geometry/rgf_cache.py). Exclusive with gae_align.
  rgf:
    enabled: false
    layer: 15                     # hidden states after this many blocks of each expert (paper: 15)
    weight: 0.5                   # lambda_RGF (paper: 0.5)
    w_intra: 1.0                  # term weights (paper: equal)
    w_cross: 1.0
    w_temporal: 1.0
    proj_dim: 2048                # g_vid 3072->2048, g_act 1024->2048 (paper)
    hidden_dim: 2048              # hidden width of the two-layer heads
    huber_beta: 1.0               # smooth-L1 beta (paper: 1)

  # --- Flow matching timestep range ---
  max_timestep_boundary: 1.0      # Upper bound (fraction of total timesteps)
  min_timestep_boundary: 0.0      # Lower bound (fraction of total timesteps)

  # --- Checkpoint ---
  output_path: outputs/openwam_checkpoints            # Base directory for checkpoint output (relative to the launch cwd)
  run_name: null                  # Dir under output_path, e.g. place_cube_right_n56 (<task>_n<training episodes>), holding
                                  # one timestamped dir per launch; null = timestamped dirs directly under output_path
  save_steps: 2000                # Save checkpoint every N steps (0 or null = disable saving)
  save_full_states_for_resume: false  # Also save resumable full state (optimizer/scheduler/RNG) at each save;
                                      # required for training.resume_ckpt_path, costs extra disk per checkpoint
  keep_last_k_ckpts: 1           # Rolling window: keep only the last K checkpoints

  # --- Finetune / Resume (mutually exclusive; both point to a training output dir, latest step auto-selected) ---
  finetune_ckpt_path: null   # non-null: warm-start from latest weights in this dir (step from 0, new output dir)
  resume_ckpt_path: null     # non-null: resume full state from latest in this dir (output reuses this dir)

  # --- Data loading ---
  dataset_num_workers: 8          # DataLoader num_workers (0 = main process)

project:
  name: openwam
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  seed: 42
  wandb:
    project: openwam
    run_name: null                # null = <training.run_name>_<launch time>, as the checkpoint dir
    entity: null
